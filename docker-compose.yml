services:
  backend:
    image: firaskhdhir/garderie-backend:latest
    container_name: garderie-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "4000:4000"
    networks:
      - garderie-net

  frontend:
    image: firaskhdhir/garderie-frontend:latest
    container_name: garderie-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      API_URL: "http://backend:4000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - garderie-net

networks:
  garderie-net:
    driver: bridge

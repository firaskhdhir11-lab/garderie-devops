services:
  backend:
    build:
      context: ./backend
    image: garderie-backend:local
    environment:
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "4002:4000"
    networks:
      - garderie-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: garderie-frontend:local
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      API_URL: "http://backend:4000"
    ports:
      - "3006:3000"
    depends_on:
      - backend
    networks:
      - garderie-net
    restart: unless-stopped

networks:
  garderie-net:
    driver: bridge
